<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262654"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>
  <!-- red ring (4-foot circle) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#cc0000" stroke-width="34"/>
  <!-- white rock disc -->
  <circle cx="256" cy="256" r="96" fill="#ffffff"/>
  <!-- blue handle dots either side of the white disc -->
  <rect x="72" y="236" width="30" height="40" rx="15" fill="#1a1a2e"/>
  <rect x="410" y="236" width="30" height="40" rx="15" fill="#1a1a2e"/>
</svg>